name: atlasmart
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.0

environment:
  sdk: ^3.9.2

dependencies:
  dio: ^5.11.1
  firebase_core: ^5.2.0
  firebase_crashlytics: ^6.1.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  http_parser: ^4.1.2
  image_picker: ^1.2.1
  intl: ^0.20.2
  mime: ^2.0.0
  
  open_filex: ^5.0.0
  permission_handler: ^13.0.2
  pin_code_fields: ^8.0.1
  razorpay_flutter: ^1.4.7
 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.10.4
  freezed: ^3.2.3
  
 

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo_icon.png"
  min_sdk_android: 21
  web:
   generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/

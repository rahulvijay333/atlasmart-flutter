name: AtlastMart CI

on:
  push:
    branches:
      - main
      
      

permissions:
  contents: read

jobs:
  flutter-ci:
    name: AtlastMart CI Pipeline
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download source code
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Step 2: Install Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      # Step 3: Generate configuration files
      - name: Generate configuration files
        env:
          GOOGLE_CONFIG: ${{ secrets.G_S_JSON }}
          ABC_CONTENT: ${{ secrets.ABC_DART_CONTENT }}
          
        run: |
          mkdir -p android/app
          mkdir -p lib/domain/core/key

          printf '%s' "$GOOGLE_CONFIG" | base64 -d > android/app/google-services.json
          printf '%s' "$ABC_CONTENT" | base64 -d > lib/domain/core/key/fbz.dart
          

      # Step 4: Install dependencies
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Step 5: Validate Dart formatting
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # Step 6: Build apk
      - name: Build release APK
        run: flutter build apk --release

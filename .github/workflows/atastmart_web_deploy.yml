name: AtlastMart Web Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions: {}

concurrency:
  group: atlastmart-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      
      - name: Generate configuration
        env:
          ABC_CONTENT: ${{ secrets.ABC_DART_CONTENT }}
        run: |
          mkdir -p lib/domain/core/key
          printf '%s' "$ABC_CONTENT" | base64 -d \
            > lib/domain/core/key/fbz.dart

      - name: Install dependencies
        run: flutter pub get


      - name: Build Flutter Web
        run: |
          flutter build web \
            --release \
            --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
